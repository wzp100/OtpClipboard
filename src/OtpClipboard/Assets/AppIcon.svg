<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-labelledby="title desc">
  <title id="title">OtpClipboard 应用图标</title>
  <desc id="desc">透明画布上的蓝色手机、三个验证码块和青绿色确认勾。</desc>
  <!-- 使用简单、粗实几何；SVG 是所有 PNG 和 ICO 的唯一绘图来源。 -->
  <g id="phone">
    <rect x="38" y="12" width="144" height="232" rx="30" fill="#146DB5"/>
    <rect x="54" y="34" width="112" height="166" rx="15" fill="#E9FAFC"/>
    <path d="M92 43h36" stroke="#146DB5" stroke-width="10" stroke-linecap="round"/>
    <path d="M94 220h32" stroke="#E9FAFC" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g id="verification-code" fill="#138D9C">
    <rect x="70" y="90" width="20" height="28" rx="6"/>
    <rect x="100" y="90" width="20" height="28" rx="6"/>
    <rect x="130" y="90" width="20" height="28" rx="6"/>
  </g>
  <g id="confirmed">
    <circle cx="178" cy="176" r="60" fill="#09A795" stroke="#E9FAFC" stroke-width="8"/>
    <path d="m149 176 19 19 38-40" fill="none" stroke="#FFFFFF"
          stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
